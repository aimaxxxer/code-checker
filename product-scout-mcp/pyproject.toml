[project]
name = "product-scout-mcp"
version = "0.1.0"
description = "MCP server connecting Claude to Chinese wholesale marketplaces for winning-product research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
product-scout-mcp = "product_scout.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/product_scout"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
